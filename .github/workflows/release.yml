name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: pnpm check
      - run: pnpm test
      - run: pnpm pack:mcpb
      # Auth via npm Trusted Publishing (OIDC): needs npm >= 11.5.1 (node 24)
      # and a Trusted Publisher entry on @alidade/mcp pointing at this file.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@alidade/mcp@$version" version >/dev/null 2>&1; then
            echo "@alidade/mcp@$version is already on npm, skipping publish"
          else
            npm publish --access public
          fi
      - name: Create GitHub release with the Desktop extension
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.mcpb --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
